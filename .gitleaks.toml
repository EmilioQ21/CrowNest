[extend]
useDefault = true

[[rules]]
id = "mongodb-uri"
description = "URI de MongoDB con usuario y contraseña"
regex = '''mongodb(?:\+srv)?://[^:\s'"/]+:[^@\s'"]+@'''

[[rules]]
id = "jwt-secret-key"
description = "Secreto JWT escrito en el código"
regex = '''secretKey\s*=\s*['"][^'"]{8,}['"]'''

[[rules]]
id = "tmdb-api-key"
description = "API key de TMDB escrita en el código"
regex = '''TMDB_API_KEY\s*:\s*['"][A-Za-z0-9]{16,}['"]'''
